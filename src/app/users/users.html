<div class="container my-5">
    <p>Login Date (Unformatted): {{todayDate}} </p>
    <p>Login Date (Formatted): {{todayDate | date :'short'}} </p>

    <h1>All Users List</h1>
    <table class="table">
        <thead>
            <tr>
                <th>Sl.no</th>
                <th>Username</th>
                <th>Email</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            <!-- Duplication -->
             @for (user of allUser | async; track $index ;let i=$index) {
                <tr>
                <td>{{i+1}}</td>
                <td>{{user.name}}</td>
                <td>{{user.email}}</td>
                <td>{{user.address.street}}</td>
            </tr>
             }
        </tbody>
    </table>

</div>
