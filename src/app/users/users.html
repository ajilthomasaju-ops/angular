<div class="container my-5">
    <p>Login Date (Unformatted): {{todayDate}} </p>
    <p>Login Date (Formatted): {{todayDate | date :'short'}} </p>

    <h1>All Users List</h1>
    <table class="table">
        <thead>
            <tr>
                <th>UserId</th>
                <th>Id</th>
                <th>title</th>
                <th>status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Duplication -->
             @for (todo of allTodos(); track $index) {
                <tr>
                <td>{{todo.userId}}</td>
                <td>{{todo.id}}</td>
                <td>{{todo.title}}</td>
                <td>{{todo.completed? 'completed' : 'Incomplete'}}</td>
            </tr>
             }
        </tbody>
    </table>

</div>
